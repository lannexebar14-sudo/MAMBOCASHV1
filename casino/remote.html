<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Télécommande Mambo</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 0,#42102d,#09050c 48%,#020203);color:#fff;font-family:Arial;display:grid;place-items:center;padding:18px}.card{width:min(520px,100%);background:#100b12;border:1px solid #7b4b79;border-radius:28px;padding:24px}.brand{text-align:center;font-size:30px;font-weight:900;color:#ffe18b}.sub{text-align:center;font-size:11px;letter-spacing:.22em;color:#aaa;margin:7px 0 20px}.pin{width:100%;padding:18px;border-radius:16px;border:1px solid #8c6a3a;background:#080808;color:#fff;text-align:center;font-size:30px;letter-spacing:.35em}.btn{width:100%;border:0;border-radius:20px;padding:20px;margin-top:12px;font-size:20px;font-weight:900}.connect{background:linear-gradient(90deg,#ff2bbd,#7a3cff);color:#fff}.go{background:linear-gradient(#ffdf74,#e6ab28);color:#070707}.reset{background:#252228;color:#fff;font-size:15px}.panel{display:none}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{padding:12px 5px;background:#181319;border-radius:14px;text-align:center}.stat b{display:block;font-size:25px;color:#ffd86a}.stat span{font-size:9px;color:#aaa}.res{text-align:center;min-height:30px;margin-top:15px;font-weight:800}.err{color:#ff7180}.ok{color:#82ffc0}.history{margin-top:18px;padding:15px;background:#0b080d;border:1px solid #4f364d;border-radius:18px}.history h3{margin:0 0 10px;font-size:14px;color:#ffe18b;letter-spacing:.08em}.historyList{display:grid;gap:7px;max-height:220px;overflow:auto}.historyItem{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:12px;background:#171118;border:1px solid #2b202c}.historyItem b{color:#8fffc5;font-size:13px}.historyItem span{color:#999;font-size:11px;white-space:nowrap}.empty{color:#777;text-align:center;font-size:12px;padding:12px 0}</style><body><div class="card"><div class="brand">LE MAMBO CASINO</div><div class="sub">TÉLÉCOMMANDE STAFF</div><div id="login"><input id="pin" class="pin" inputmode="numeric" maxlength="4" placeholder="••••"><button id="connect" class="btn connect">ENTRER</button><div id="loginMsg" class="res"></div></div><div id="panel" class="panel"><div class="stats"><div class="stat"><b id="count">—</b><span>PARTIES</span></div><div class="stat"><b id="next">—</b><span>JACKPOT</span></div><div class="stat"><b id="meters">—</b><span>MÈTRES / 2</span></div></div><button id="go" class="btn go">LANCER UNE PARTIE</button><button id="reset" class="btn reset">REMETTRE À ZÉRO</button><div id="res" class="res"></div><div class="history"><h3>HISTORIQUE DES GAINS</h3><div id="historyList" class="historyList"></div></div></div></div><script>const API='https://otgubsvmcbaocrndngrq.supabase.co/functions/v1/mambo-tv-game',HKEY='mambo_gain_history_v1';let code='';const el=id=>document.getElementById(id);function showStats(d){let n=Number(d.draw_count||0);el('count').textContent=n;el('next').textContent=30-(n%30);el('meters').textContent=Number(d.meters_won||0)}function getHistory(){try{return JSON.parse(localStorage.getItem(HKEY)||'[]')}catch{return[]}}function saveHistory(h){localStorage.setItem(HKEY,JSON.stringify(h));renderHistory()}function addGain(gift){let h=getHistory();h.unshift({gift:gift||'GAIN',time:new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})});saveHistory(h.slice(0,100))}function clearHistory(){localStorage.removeItem(HKEY);renderHistory()}function renderHistory(){let h=getHistory(),box=el('historyList');if(!h.length){box.innerHTML='<div class="empty">Aucun gain depuis la remise à zéro</div>';return}box.innerHTML=h.map(x=>'<div class="historyItem"><b>'+x.gift+'</b><span>'+x.time+'</span></div>').join('')}async function refresh(){try{let r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});let d=await r.json();if(r.ok)showStats(d)}catch{}}async function send(action){el('res').textContent='Envoi…';try{let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-staff-code':code},body:JSON.stringify({action})});let d=await r.json();if(r.status===401){el('panel').style.display='none';el('login').style.display='block';el('loginMsg').className='res err';el('loginMsg').textContent='Code incorrect';return}if(!r.ok)throw 0;showStats(d);if(action==='reset')clearHistory();else if(d.status==='win')addGain(d.gift);el('res').className='res '+(d.status==='win'?'ok':'');el('res').textContent=action==='reset'?'Soirée remise à zéro ✓':d.status==='win'?'GAGNÉ — '+d.gift:'PERDU'}catch{el('res').className='res err';el('res').textContent='Erreur de connexion'}}el('connect').onclick=async()=>{code=el('pin').value.trim();if(!/^\d{4}$/.test(code)){el('loginMsg').className='res err';el('loginMsg').textContent='Entre les 4 chiffres';return}try{let r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-staff-code':code},body:JSON.stringify({action:'check'})});if(r.status===401)throw 0;el('login').style.display='none';el('panel').style.display='block';renderHistory();refresh()}catch{el('loginMsg').className='res err';el('loginMsg').textContent='Code incorrect'}};el('go').onclick=()=>send('launch');el('reset').onclick=()=>send('reset');renderHistory();refresh();setInterval(refresh,4000)</script>
