<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NIGHTQUIZ</title><style>*{box-sizing:border-box}body{margin:0;background:#0a0a0f;color:#f5f5fb;font-family:Inter,system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.page{display:none}.page.on{display:block}.shell{display:flex;min-height:100vh}.side{width:245px;background:#0e0e14;border-right:1px solid #282832;padding:22px 14px;position:fixed;inset:0 auto 0 0}.logo{font-weight:950;font-size:20px}.logo i{font-style:normal;color:#9a73ff}.venue{margin:24px 0;padding:13px;background:#17171f;border:1px solid #2d2d38;border-radius:12px;font-size:12px}.trial{margin-top:8px;color:#bda8ed;font-size:10px}.menu{display:grid;gap:5px}.menu button{border:0;background:transparent;color:#888694;text-align:left;padding:12px;border-radius:9px}.menu button:hover,.menu button.sel{background:#1a1a22;color:#fff}.main{margin-left:245px;width:calc(100% - 245px);padding:34px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end}.head h1{margin:7px 0;font-size:31px}.head p,.muted{color:#878593;font-size:13px}.pill{display:inline-block;border:1px solid #383642;background:#14141b;color:#b9a7e1;border-radius:99px;padding:6px 10px;font-size:10px}.btn{border:1px solid #33333e;background:#191921;color:#fff;border-radius:10px;padding:11px 15px;font-weight:800}.primary{border:0;background:linear-gradient(135deg,#9d76ff,#6e40df)}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:24px}.card{background:#131319;border:1px solid #2b2b35;border-radius:14px;padding:18px}.card small{color:#777582}.card strong{display:block;font-size:29px;margin-top:5px}.cols{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;margin-top:10px}.code{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#1b1b24;border-radius:10px;padding:14px}.code b{font-size:28px;letter-spacing:.15em}.bars{height:150px;display:flex;gap:8px;align-items:end}.bars i{flex:1;background:linear-gradient(#9b74ff,#6540c8);border-radius:5px 5px 0 0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0 12px}.search,input,select{background:#181820;border:1px solid #32323d;color:#fff;border-radius:9px;padding:11px}.search{min-width:280px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 8px;border-bottom:1px solid #292933;text-align:left;font-size:12px}.table th{font-size:10px;color:#777582}.tag{padding:5px 8px;border-radius:99px;background:#211a2d;color:#bea9ed;font-size:10px}.field{margin:16px 0}.field label{display:block;font-size:10px;color:#bbb9c5;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%}.choices,.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.choices button,.cats button{background:#191921;border:1px solid #33333d;color:#aaa8b3;border-radius:10px;padding:16px}.choices button.sel,.cats button.on{border-color:#8c5cf4;background:#211831;color:#fff}.steps{display:flex;gap:18px;flex-wrap:wrap;margin:24px 0;color:#777582;font-size:11px}.steps span.on{color:#fff}.steps b{display:inline-grid;place-items:center;width:25px;height:25px;border:1px solid #3a3945;border-radius:50%}.steps span.on b{background:#8b5cf6;border-color:#8b5cf6}.notice{padding:14px;border-radius:11px;background:#181321;border:1px solid #3b2d51;color:#c8b5eb;font-size:12px}.success{background:#11231d;border-color:#2d6d53;color:#75d9ac}.spacegrid,.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.space,.plan{background:#131319;border:1px solid #2b2b35;border-radius:14px;padding:18px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#46d597;margin-right:6px}.preview{min-height:230px;border:1px solid #2d2d38;border-radius:15px;background:radial-gradient(circle at 50% 20%,#2a194b,transparent 45%),#0a0a0f;display:grid;place-items:center;text-align:center}.colors{display:flex;gap:8px}.colors button{width:38px;height:38px;border-radius:50%;border:3px solid transparent}.colors button.on{border-color:#fff}.switchrow{display:flex;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid #282832}.switch{width:46px;height:26px;border-radius:99px;background:#8052ef;padding:3px}.switch i{display:block;width:20px;height:20px;background:#fff;border-radius:50%;margin-left:20px}.plan.hot{border-color:#7450d7;background:linear-gradient(#1b1430,#131319 45%)}.plan h2{font-size:38px;margin:14px 0}.tv{min-height:100vh;padding:28px 40px;background:radial-gradient(circle at center,#20143b,transparent 40%),#08080c;display:flex!important;flex-direction:column}.tvhead,.tvfoot{display:flex;justify-content:space-between;align-items:center}.question{margin:auto;width:min(1100px,95%);text-align:center}.question h1{font-size:56px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}.answers div{background:#15151d;border:1px solid #30303b;border-radius:13px;padding:18px;font-size:21px;font-weight:800}.timer{width:70px;height:70px;border:5px solid #8b5cf6;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:900}@media(max-width:850px){.side{width:72px}.venue,.menu button span,.logo{display:none}.menu button{text-align:center;font-size:20px}.main{margin-left:72px;width:calc(100% - 72px);padding:20px}.grid4,.cols,.spacegrid,.plans{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid4,.cols,.spacegrid,.plans,.answers{grid-template-columns:1fr}.choices,.cats{grid-template-columns:1fr 1fr}.search{min-width:100%}.head{align-items:flex-start;flex-direction:column}.question h1{font-size:32px}.tv{padding:18px}}</style></head><body><section id="app" class="page on"><div class="shell"><aside class="side"><b class="logo">NIGHT<i>QUIZ</i></b><div class="venue">LE MAMBO · PRO<div class="trial">Essai gratuit : 12 jours restants</div></div><nav class="menu" id="menu"><button data-tab="home"><b>⌂</b> <span>Accueil</span></button><button data-tab="new"><b>＋</b> <span>Nouvelle partie</span></button><button data-tab="questions"><b>▤</b> <span>Questions</span></button><button data-tab="stats"><b>↗</b> <span>Statistiques</span></button><button data-tab="spaces"><b>▣</b> <span>Espaces & TV</span></button><button data-tab="brand"><b>◈</b> <span>Personnalisation</span></button><button data-tab="billing"><b>€</b> <span>Abonnement</span></button></nav></aside><main class="main" id="main"></main></div></section><section id="tv" class="page tv"><header class="tvhead"><b>LE MAMBO · ESPACE PRINCIPAL</b><span>38 joueurs · ● LIVE</span></header><div class="question"><small>MUSIQUE · QUESTION 12 / 30</small><h1>Quel groupe a interprété « Bohemian Rhapsody » ?</h1><div class="answers" id="answers"><div>A · Queen</div><div>B · Oasis</div><div>C · Nirvana</div><div>D · U2</div></div></div><footer class="tvfoot"><div><small>CODE</small><h2>4827</h2><button class="btn" id="back">← Dashboard</button></div><div class="timer" id="timer">20</div></footer></section><script>(()=>{const S={tab:'home',step:1,color:'#8b5cf6',name:'LE MAMBO',filter:'Toutes',questions:[['Quel groupe a interprété « Bohemian Rhapsody » ?','Musique','Queen'],['Quelle est la capitale du Portugal ?','Géographie','Lisbonne'],['Combien font 12 × 8 ?','Calcul','96'],['En quelle année débute la Révolution française ?','Histoire','1789'],['Quel joueur a remporté le plus de Ballons d’Or ?','Sport','Lionel Messi']]};const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function layout(t,s,a='',b=''){return `<header class="head"><div><span class="pill">ESPACE ÉTABLISSEMENT</span><h1>${t}</h1><p>${s}</p></div>${a}</header>${b}`}function home(){return layout('Bonsoir, Le Mambo 👋','Voici l’activité de votre établissement aujourd’hui.','<button class="btn primary" data-tab="new">＋ Nouvelle partie</button>',`<div class="grid4"><div class="card"><small>PARTIES CE MOIS</small><strong>12</strong></div><div class="card"><small>JOUEURS</small><strong>428</strong></div><div class="card"><small>TAUX DE RÉPONSE</small><strong>91%</strong></div><div class="card"><small>QUESTIONS</small><strong>2 072</strong></div></div><div class="cols"><div class="card"><small>PROCHAINE SOIRÉE</small><h3>Quiz Général · Vendredi</h3><p class="muted">Espace principal · 21:00 · 30 questions</p><div class="code"><b>4827</b><button class="btn primary" id="openTv">▶ Écran TV</button></div></div><div class="card"><small>PARTICIPATION</small><div class="bars"><i style="height:42%"></i><i style="height:58%"></i><i style="height:49%"></i><i style="height:71%"></i><i style="height:83%"></i><i style="height:100%"></i></div></div></div>`)}function newGame(){let c='';if(S.step===1)c=`<div class="field"><label>NOM</label><input value="Quiz Général — Vendredi"></div><div class="field"><label>ESPACE</label><select><option>Espace principal</option><option>Terrasse arrière</option></select></div><div class="field"><label>NOMBRE DE QUESTIONS</label><div class="choices"><button>20</button><button class="sel">30</button><button>50</button><button>100</button></div></div>`;if(S.step===2)c=`<div class="cats"><button class="on">Musique</button><button class="on">Culture générale</button><button class="on">Sport</button><button>Histoire</button><button>Logique</button><button>Sciences</button><button>Nature</button><button>Calcul</button></div>`;if(S.step===3)c=`<div class="field"><label>1ER PRIX</label><input value="50€ de consommation"></div><div class="field"><label>2E PRIX</label><input value="1 bouteille de bulles"></div><div class="field"><label>3E PRIX</label><input value="1 consommation"></div>`;if(S.step===4)c=`<div class="notice success">✓ Cette partie appartient uniquement à LE MAMBO · Espace principal.</div>`;return layout('Nouvelle partie','Configurez la soirée en 4 étapes.','',`<div class="steps">${['Format','Catégories','Lots','Confirmation'].map((x,i)=>`<span class="${S.step===i+1?'on':''}"><b>${i+1}</b> ${x}</span>`).join('')}</div><div class="card">${c}<div style="display:flex;justify-content:space-between;margin-top:20px"><button class="btn" id="prev">← Retour</button><button class="btn primary" id="next">${S.step===4?'Créer et ouvrir la TV':'Continuer →'}</button></div></div>`)}function questions(){const rows=S.questions.filter(q=>S.filter==='Toutes'||q[1]===S.filter);return layout('Questions','Banque officielle + questions privées de votre établissement.','<button class="btn primary" id="addQ">＋ Ajouter une question</button>',`<div class="toolbar">${['Toutes','Musique','Sport','Histoire','Calcul'].map(x=>`<button class="btn ${S.filter===x?'primary':''}" data-filter="${x}">${x}</button>`).join('')}</div><div class="card"><div class="notice">Les questions privées de LE MAMBO ne sont jamais visibles par un autre établissement.</div><table class="table"><tr><th>QUESTION</th><th>CATÉGORIE</th><th>RÉPONSE</th></tr>${rows.map(q=>`<tr><td>${q[0]}</td><td><span class="tag">${q[1]}</span></td><td>${q[2]}</td></tr>`).join('')}</table></div>`)}function stats(){return layout('Statistiques','Suivez la performance de vos soirées quiz.','',`<div class="grid4"><div class="card"><small>JOUEURS</small><strong>428</strong></div><div class="card"><small>PARTIES</small><strong>12</strong></div><div class="card"><small>MOYENNE / PARTIE</small><strong>35,7</strong></div><div class="card"><small>FIDÉLITÉ</small><strong>34%</strong></div></div><div class="cols"><div class="card"><h3>Participation</h3><div class="bars"><i style="height:45%"></i><i style="height:58%"></i><i style="height:66%"></i><i style="height:55%"></i><i style="height:78%"></i><i style="height:100%"></i></div></div><div class="card"><h3>Meilleures catégories</h3><p>Musique <b style="float:right">82%</b></p><p>Sport <b style="float:right">76%</b></p><p>Culture générale <b style="float:right">73%</b></p></div></div>`)}function spaces(){return layout('Espaces & TV','Chaque écran TV appartient à un espace précis de cet établissement.','<button class="btn primary" id="addSpace">＋ Nouvel espace</button>',`<div class="notice">Isolation active : ces écrans appartiennent uniquement à LE MAMBO.</div><div class="spacegrid"><div class="space"><span class="dot"></span><b>Espace principal</b><p class="muted">TV principale · connectée</p><button class="btn openTv">Ouvrir la TV</button></div><div class="space"><span class="dot"></span><b>Terrasse arrière</b><p class="muted">TV terrasse · connectée</p><button class="btn openTv">Ouvrir la TV</button></div><div class="space"><b>＋ Ajouter un écran</b><p class="muted">Associer une nouvelle TV à cet établissement.</p><button class="btn" id="addScreen">Associer</button></div></div>`)}function brand(){return layout('Personnalisation','Adaptez le quiz à l’identité de votre établissement.','<button class="btn primary" id="saveBrand">Enregistrer</button>',`<div class="cols"><div class="card"><div class="field"><label>NOM AFFICHÉ</label><input id="barName" value="${S.name}"></div><div class="field"><label>COULEUR</label><div class="colors">${['#8b5cf6','#1fc7a1','#ff4d88','#ff9f43','#3a86ff'].map(c=>`<button data-color="${c}" class="${S.color===c?'on':''}" style="background:${c}"></button>`).join('')}</div></div><div class="switchrow"><span>Afficher le logo sur TV</span><div class="switch"><i></i></div></div><div class="switchrow"><span>Afficher les lots</span><div class="switch"><i></i></div></div></div><div class="preview"><div><span class="pill">APERÇU TV</span><h2 id="prevName">${S.name}</h2><p class="muted">Quel artiste chante « Formidable » ?</p><button class="btn primary" id="previewButton" style="background:${S.color}">Réponse A</button></div></div></div>`)}function billing(){return layout('Abonnement','14 jours gratuits puis abonnement obligatoire.','',`<div class="notice success"><b>Essai gratuit actif</b><br>12 jours restants sur 14.</div><div class="plans"><div class="plan"><b>STARTER</b><h2>29€<small>/mois</small></h2><p class="muted">4 soirées · 50 joueurs · 1 espace</p><button class="btn" data-plan="Starter">Choisir</button></div><div class="plan hot"><b>PRO</b><h2>59€<small>/mois</small></h2><p class="muted">Illimité · 150 joueurs · 3 espaces</p><button class="btn primary" data-plan="Pro">Choisir Pro</button></div><div class="plan"><b>PREMIUM</b><h2>99€<small>/mois</small></h2><p class="muted">Joueurs et espaces illimités</p><button class="btn" data-plan="Premium">Choisir</button></div></div><div class="card" style="margin-top:12px"><b>À la fin des 14 jours</b><p class="muted">Sans abonnement actif, la création et le lancement de nouvelles parties sont bloqués. Les données restent conservées.</p></div>`)}function render(){const f={home,new:newGame,questions,stats,spaces,brand,billing}[S.tab];$('#main').innerHTML=f();$$('#menu button').forEach(b=>b.classList.toggle('sel',b.dataset.tab===S.tab));bind()}function bind(){$$('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});$$('.choices button').forEach(b=>b.onclick=()=>{$$('.choices button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});$$('.cats button').forEach(b=>b.onclick=()=>b.classList.toggle('on'));const p=$('#prev'),n=$('#next');if(p)p.onclick=()=>{S.step=Math.max(1,S.step-1);render()};if(n)n.onclick=()=>{if(S.step<4){S.step++;render()}else openTv()};$$('[data-filter]').forEach(b=>b.onclick=()=>{S.filter=b.dataset.filter;render()});const aq=$('#addQ');if(aq)aq.onclick=()=>{S.questions.unshift(['Nouvelle question privée','Culture générale','À définir']);render()};$$('[data-color]').forEach(b=>b.onclick=()=>{S.color=b.dataset.color;render()});const bn=$('#barName');if(bn)bn.oninput=e=>{S.name=e.target.value||'Mon établissement';$('#prevName').textContent=S.name};const sb=$('#saveBrand');if(sb)sb.onclick=()=>{sb.textContent='✓ Enregistré';setTimeout(()=>sb.textContent='Enregistrer',1000)};const os=$('#addSpace');if(os)os.onclick=()=>alert('Démo : nouvel espace créé pour cet établissement.');const as=$('#addScreen');if(as)as.onclick=()=>alert('Démo : nouvel écran associé à cet établissement.');$$('.openTv').forEach(b=>b.onclick=openTv);const ot=$('#openTv');if(ot)ot.onclick=openTv;$$('[data-plan]').forEach(b=>b.onclick=()=>alert('Démo '+b.dataset.plan+' : Stripe sera branché ici.'))}let tmr;function openTv(){$('#app').classList.remove('on');$('#tv').classList.add('on');clearInterval(tmr);let t=20;$('#timer').textContent=t;tmr=setInterval(()=>{t--;$('#timer').textContent=t;if(t<=0){clearInterval(tmr);const a=$$('#answers div');a[0].style.borderColor='#46d597';a[0].style.background='#10271c';a.slice(1).forEach(x=>x.style.opacity=.35)}},1000)}$('#back').onclick=()=>{$('#tv').classList.remove('on');$('#app').classList.add('on');render()};render()})();</script></body></html>
